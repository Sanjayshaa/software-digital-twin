version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"

  order-service:
    build: ./services/order-service
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379

  payment-service:
    build: ./services/payment-service
    ports:
      - "8002:8002"
    environment:
      - DB_URL=postgresql://user:pass@postgres:5432/payments

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
